function renderTemplateCard(k){const t=TPL[k];if(!t)return '';const isActive=style.template===k;return `<button class="template ${isActive?'active':''}" onclick="applyTpl('${k}')" title="${esc(t[0])}"><div style="height:6px;border-radius:3px;margin-bottom:8px;background:linear-gradient(90deg,${t[2]},${t[5]});"></div><b style="font-size:24px;display:block;margin-bottom:4px">${t[1]}</b><div style="font-size:0.82rem;font-weight:800;margin-bottom:6px">${t[0]}</div><div style="display:flex;gap:3px;justify-content:center;margin-bottom:4px"><div style="width:14px;height:14px;border-radius:50%;background:${t[2]};border:1px solid rgba(0,0,0,0.15)"></div><div style="width:14px;height:14px;border-radius:50%;background:${t[3]};border:1px solid rgba(0,0,0,0.15)"></div><div style="width:14px;height:14px;border-radius:50%;background:${t[5]};border:1px solid rgba(0,0,0,0.15)"></div></div><div class="muted" style="font-size:0.68rem">${t[6]}</div></button>`}

function addSubQ(){if(!q().subQuestions)q().subQuestions=[];if(q().subQuestions.length>=8)return;q().subQuestions.push({text:'',answer:'',score:0.25});save();render()}function delSubQ(i){if(!confirm('این زیرسوال حذف بشه؟'))return;q().subQuestions.splice(i,1);save();render()}function saveSubQ(i,key,value){if(!q().subQuestions)q().subQuestions=[];if(!q().subQuestions[i])q().subQuestions[i]={};q().subQuestions[i][key]=value;save()}function renderSubQuestions(x,answers){if(!x.subQuestions||!x.subQuestions.length)return '';const letters=['الف','ب','ج','د','ه','و','ز','ح'];return `<div class="sub-questions-list">${x.subQuestions.map((sq,i)=>`<div class="sub-q-row"><span class="sub-q-letter">${letters[i]})</span><span class="sub-q-text">${esc(sq.text||'')}</span>${answers&&sq.answer?`<span class="sub-q-ans">✓ ${esc(sq.answer)}</span>`:''}</div>`).join('')}</div>}function renderOptionsWithLayout(x,answers){const opts=x.options||[];const layout=style.optionsLayout||'stacked';const isMulti=x.type==='multi';const checkMark=j=>{if(!answers)return '';return(isMulti?(x.answer||[]).includes(j):x.answer===j)?' ✓':''};if(layout==='stacked')return opts.map((o,j)=>`<div class="popt">${isMulti?'☐':'○'} ${String.fromCharCode(65+j)}. ${esc(o)}${checkMark(j)}</div>`).join('');if(layout==='inline')return `<div class="opt-inline-wrap">${opts.map((o,j)=>`<span class="opt-inline">${isMulti?'☐':'○'} ${String.fromCharCode(65+j)}. ${esc(o)}${checkMark(j)}</span>`).join('')}</div>`;const cols=layout==='two-col'?2:3;return `<div class="opt-grid opt-grid-${cols}">${opts.map((o,j)=>`<div class="popt">${isMulti?'☐':'○'} ${String.fromCharCode(65+j)}. ${esc(o)}${checkMark(j)}</div>`).join('')}</div>}function renderQuestionContent(x,answers){let b='';if(x.image)b+=`<img src="${esc(x.image)}" style="max-width:100%;display:block;margin:6px 0">`;if(x.type!=='blank')b+=`<div style="margin-bottom:4px">${esc(x.text)}</div>`;b+=renderSubQuestions(x,answers);if(x.type==='mcq'||x.type==='multi')b+=renderOptionsWithLayout(x,answers);else if(x.type==='tf')b+=`<div style="padding:2px 0">☐ صحیح &nbsp;&nbsp; ☐ غلط ${answers?' پاسخ: '+(x.answer?'صحیح':'غلط'):''}</div>`;else if(x.type==='short')b+=`<div style="padding:2px 0">پاسخ: ${answers?esc((x.shortAnswers||[]).join(' / ')):'......................'}</div>`;else if(x.type==='blank')b+=`<div style="padding:2px 0">${esc(x.text).replace(/__/g,'________')}</div>`;else if(x.type==='match')b+=(x.pairs||[]).map((p,j)=>`<div style="padding:2px 0">${fa(j+1)}. ${esc(p[0])} ↔ ${answers?esc(p[1]):'..............'}</div>`).join('');else if(x.type==='dropdown')b+=`<div style="padding:2px 0">${answers?'انتخاب: '+esc(x.dropdownAnswer||'—'):'انتخاب: '+(x.dropdownOptions||[]).map(o=>`<span style="display:inline-block;border:1px solid #999;padding:2px 10px;margin:2px;font-size:.9em">${esc(o)||'...'}</span>`).join('')}</div>`;else b+=`<div style="min-height:60px;padding:4px 0">پاسخ: ...................................................</div>`;if(answers&&x.explanation)b+=`<div style="margin-top:5px;padding:4px 8px;border-right:2px solid ${style.primary};background:rgba(0,0,0,.04);font-size:.85em">${esc(x.explanation)}</div>`;if(x.pageBreakAfter)b+=`<div class="page-break"></div>`;return b}
function paper(answers){

function exportAnswerKey(){if(!validateExam())return;const e=exam();const letters=['الف','ب','ج','د','ه','و','ز','ح'];let rows=[];e.questions.forEach((x,i)=>{if(x.subQuestions&&x.subQuestions.length){x.subQuestions.forEach((sq,j)=>rows.push({num:fa(i+1)+'-'+letters[j],answer:sq.answer||'—',reference:x.reference||'—',score:sq.score||0.25}))}else rows.push({num:fa(i+1),answer:answer(x)||'—',reference:x.reference||'—',score:x.score||1})});const totalScore=rows.reduce((sum,r)=>sum+(+r.score||0),0);const html='<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><title>کلید پاسخ — '+esc(e.title||'آزمون')+'</title><style>body{font-family:Vazirmatn,Tahoma,sans-serif;padding:20px;direction:rtl;color:#2a1a08}h1{color:#7a4400;text-align:center;border-bottom:2px solid #c9941a;padding-bottom:10px}.meta{display:flex;justify-content:space-between;padding:10px;background:#faf3e0;border-radius:8px;margin-bottom:16px;font-size:.9em}table{width:100%;border-collapse:collapse;font-size:.9em}th,td{border:1px solid #999;padding:7px 10px;text-align:center}th{background:#f0e8d8;font-weight:900}td:nth-child(2){text-align:right;font-weight:700}tr:nth-child(even){background:#faf9f5}.total{background:#f0e8d8!important;font-weight:900;font-size:1.05em}@media print{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}</style></head><body><h1>🔑 کلید پاسخ — '+esc(e.title||'آزمون')+'</h1><div class="meta"><span>📚 '+esc(e.subject||'—')+'</span><span>📅 '+esc(e.date||'—')+'</span><span>👤 '+esc(e.teacher||'—')+'</span></div><table><thead><tr><th style="width:80px">شماره</th><th>پاسخ</th><th style="width:150px">مرجع</th><th style="width:70px">بارم</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.num+'</td><td>'+esc(r.answer)+'</td><td>'+esc(r.reference)+'</td><td>'+fa(r.score)+'</td></tr>').join('')+'<tr class="total"><td colspan="3" style="text-align:left">جمع کل نمره</td><td>'+fa(totalScore)+'</td></tr></tbody></table></body></html>';const w=window.open('','_ function word(){if(!validateExam())return;hakimSay('خروجی Word آماده شد.');dl('azmoon-saz.doc',exportPaperHTML(false),'application/msword')}function printWin(ans){if(!validateExam())return;hakimSay('خروجی چاپ آماده شد.');let w=open();if(!w)return;w.document.write(exportPaperHTML(ans));w.document.close();w.onload=()=>w.print()}async function png(showAnswers=false){if(!validateExam())return;let tempEl=document.createElement('div');tempEl.innerHTML=paper(showAnswers);let p=tempEl.firstElementChild;tempEl.style.position='fixed';tempEl.style.left='-100000px';tempEl.style.top='0';document.body.appendChild(tempEl);if(!window.html2canvas){tempEl.remove();return alert('html2canvas در دسترس نیست.')}try{const c=await html2canvas(p,{scale:2,useCORS:true});c.toBlob(b=>{if(!b){tempEl.remove();return}const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=showAnswers?'azmoon-saz-answer.png':'azmoon-saz.png';a.click();setTimeout(()=>{URL.revokeObjectURL(url);tempEl.remove()},1000)})}catch(err){tempEl.remove();throw err}}function backup(){if(!validateExam())return;dl('azmoon-saz-backup.json',JSON.stringify({version:1,exams:data.exams,currentExamId:data.currentExamId,style},null,2),'application/json;charset=utf-8')}function pickJSON(){const i=document.getElementById('jsonIn');i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.exams)throw 0;data=x.exams?x:{exams:[x.exam],currentExamId:x.exam.id};style={...style,...(x.style||{})};save();render()}catch{alert('فایل JSON معتبر نیست.')}};r.readAsText(i.files[0])};i.click()}function csv(){if(!validateExam())return;let rows=[['شماره','نوع','متن','پاسخ','توضیح','درس','نمره'],...exam().questions.map((x,i)=>[i+1,TYPES[x.type],x.text,answer(x),x.explanation,x.lesson,x.score])];dl('azmoon-saz.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function answer(x){if(x.type==='mcq')return x.options?.[x.answer]||'';if(x.type==='multi')return(x.answer||[]).map(i=>x.options?.[i]||'').join(' | ');if(x.type==='tf')return x.answer?'صحیح':'غلط';if(x.type==='short')return(x.shortAnswers||[]).join(' | ');if(x.type==='blank')return(x.blankAnswers||[]).join(' | ');if(x.type==='match')return(x.pairs||[]).map(p=>p.join(' ↔ ')).join(' | ');if(x.type==='dropdown')return x.dropdownAnswer||'';return x.sampleAnswer||''}
function online(){let e=exam();return `<div class="card"><h2>آزمون آنلاین</h2><div class="grid info"><div><label>زمان (دقیقه)</label><input data-online="onlineDuration" type="number" value="${e.onlineDuration||15}"></div><div><label>ترتیب</label><select data-online="random"><option value="false" ${!e.random?'selected':''}>به ترتیب</option><option value="true" ${e.random?'selected':''}>تصادفی</option></select></div><div><label>نمایش پاسخ درست</label><select data-online="showCorrect"><option value="end" ${e.showCorrect!=='after'?'selected':''}>خیر، فقط پایان</option><option value="after" ${e.showCorrect==='after'?'selected':''}>بله بعد از پاسخ</option></select></div><div><label>نام اجباری</label><select data-online="requireName"><option value="true" ${e.requireName!==false?'selected':''}>بله</option><option value="false" ${e.requireName===false?'selected':''}>خیر</option></select></div></div><div class="btnrow"><button class="btn primary" onclick="buildOnline()">🎮 ساخت فایل آزمون آنلاین</button><button class="btn" onclick="previewOnline()">👁️ پیش‌نمایش آزمون</button></div></div>`}
function buildOnline(){if(!validateExam())return;hakimSay('فایل آزمون آنلاین آماده شد.');dl('azmoon-online.html',onlineHTML(),'text/html;charset=utf-8')}function previewOnline(){if(!validateExam())return;let w=open();w.document.write(onlineHTML());w.document.close()}function onlineHTML(){let e=JSON.parse(JSON.stringify(exam())),cfg={duration:+e.onlineDuration||15,random:!!e.random,showCorrect:e.showCorrect||'end',requireName:e.requireName!==false};const safe=v=>JSON.stringify(v).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');return `<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(e.title)}</title><style>*{box-sizing:border-box}body{margin:0;background:#140b04;color:#f5edd6;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:18px}.box{background:#1b1008;border:1px solid #76521e;border-radius:16px;padding:20px}.q{background:#fff;color:#241305;padding:20px;border-radius:12px}.opt{display:block;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:8px}.top{display:flex;justify-content:space-between}.timer{font-size:21px}.danger{color:#e74c3c}.bar{height:8px;background:#39230d;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#f5c842}.btn{padding:11px 16px;border-radius:9px;border:1px solid #805a20;background:#f5c842;color:#241305;font-weight:bold}.nav{display:flex;justify-content:space-between;margin-top:15px;gap:8px}.feedback{margin-top:10px;padding:9px;border-radius:8px}.ok{background:#d9f2df;color:#175b28}.bad{background:#f7d7d7;color:#7b1717}input,textarea,select{font:inherit;max-width:100%}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #777;text-align:right}.result-box{text-align:center}.result-score{padding:20px;background:linear-gradient(135deg,#f5c842,#c9941a);border-radius:16px;margin:16px 0;color:#120500}.big-score{font-size:3.5em;font-weight:900;line-height:1}.score-detail{font-size:1em;margin-top:8px;font-weight:700}.result-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:14px;background:rgba(255,255,255,0.05);border-radius:12px;margin-bottom:18px;font-size:.95em}.result-actions{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px}.result-actions .btn{padding:12px 10px;font-size:.9em;text-align:center;width:100%}.qr-box{padding:16px;background:rgba(255,255,255,.05);border:1px dashed #f5c842;border-radius:12px;margin-bottom:18px}</style></head><body><main id="root"></main><script>const EXAM=${safe(e)},CFG=${safe(cfg)};let qs=[...EXAM.questions],idx=0,answers=Array(qs.length).fill(null),started=0,student='';if(CFG.random)qs.sort(()=>Math.random()-.5);const root=document.getElementById('root');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){return String(v??'').trim().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLowerCase()}function eq(a,b){a=[...(a||[])].map(String).sort();b=[...(b||[])].map(String).sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}function check(q,a){if(a===null||a===undefined||a==='')return null;if(q.type==='mcq'||q.type==='tf')return a===q.answer;if(q.type==='multi')return eq(a,q.answer||[]);if(q.type==='short')return(q.shortAnswers||[]).map(norm).includes(norm(a));if(q.type==='blank'){let e=q.blankAnswers||[],v=Array.isArray(a)?a:[a];return e.length===v.length&&e.every((x,i)=>norm(x)===norm(v[i]));}if(q.type==='match'){if(!Array.isArray(a))return false;let n=(q.pairs||[]).length;if(!n)return null;return a.reduce((z,v,j)=>z+(norm(v)===norm(q.pairs[j]?.[1])?1:0),0)/n}if(q.type==='dropdown')return norm(a)===norm(q.dropdownAnswer);return null}function feedback(q,a){if(CFG.showCorrect!=='after')return '';let r=check(q,a);if(r===null)return '';if(r===true||r===1)return '<div class="feedback ok">✓ پاسخ درست است.</div>';if(r===false||r===0)return '<div class="feedback bad">✗ پاسخ نادرست است.</div>';return '<div class="feedback">درصد تطبیق: '+Math.round(r*100)+'٪</div>'}function start(){student=document.getElementById('student').value.trim();if(CFG.requireName&&!student)return alert('نام دانش‌آموز را وارد کن.');started=Date.now();renderQ();clock()}function renderStart(){root.innerHTML='<div class="box"><h1>'+esc(EXAM.title)+'</h1><p>'+esc(EXAM.grade||'')+' '+esc(EXAM.school||'')+'</p><label>نام دانش‌آموز '+(CFG.requireName?'*':'(اختیاری)')+'</label><input id="student" style="width:100%;padding:12px;margin:8px 0"><button class="btn" onclick="start()">شروع آزمون</button></div>'}function renderQ(){let q=qs[idx],a=answers[idx],b='';if(q.type==='mcq'||q.type==='multi')b=(q.options||[]).map((o,j)=>'<label class="opt"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="a" value="'+j+'" '+(q.type==='multi'?(a||[]).includes(j)?'checked':'':a===j?'checked':'')+' onchange="saveA()"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('');else if(q.type==='tf')b='<label class="opt"><input type="radio" name="a" value="true" '+(a===true?'checked':'')+' onchange="saveA()"> صحیح</label><label class="opt"><input type="radio" name="a" value="false" '+(a===false?'checked':'')+' onchange="saveA()"> غلط</label>';else if(q.type==='blank'){let n=(q.blankAnswers||[]).length||1;b=Array.from({length:n},(_,k)=>'<input class="opt" id="blank'+k+'" placeholder="جای خالی '+(k+1)+'" value="'+esc(Array.isArray(a)?a[k]||'':k===0&&!Array.isArray(a)?a||'':'')+'" oninput="saveA()">').join('')}else if(q.type==='match'){let pairs=q.pairs||[];b=pairs.map((p,k)=>'<div class="opt"><b>'+esc(p[0])+'</b> <select id="match'+k+'" onchange="saveA()"><option value="">انتخاب کنید</option>'+pairs.map((z,j)=>'<option value="'+j+'" '+(Array.isArray(a)&&String(a[k])===String(z[1])?'selected':'')+'>'+esc(z[1])+'</option>').join('')+'</select></div>').join('')}else if(q.type==='dropdown'){b='<select id="dropdownAns" class="opt" onchange="saveA()"><option value="">انتخاب کنید...</option>'+(q.dropdownOptions||[]).map(o=>'<option value="'+esc(o)+'" '+(norm(a)===norm(o)?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'}else b='<textarea id="ans" style="width:100%;min-height:120px" oninput="saveA()">'+esc(Array.isArray(a)?a.join(','):a||'')+'</textarea>';root.innerHTML='<div class="box"><div class="top"><b>سوال '+(idx+1)+' از '+qs.length+'</b><b id="timer" class="timer"></b></div><div class="bar"><i style="width:'+((idx+1)/qs.length*100)+'%"></i></div><div class="q"><h2>'+esc(q.type==='blank'?q.text.replace(/__/g,'_____'):q.text)+'</h2>'+b+feedback(q,a)+'</div><div class="nav"><button class="btn" onclick="saveA();idx=Math.max(0,idx-1);renderQ()">قبلی</button><button class="btn" onclick="saveA();'+(idx===qs.length-1?'finish()':'idx++;renderQ()')+'">'+(idx===qs.length-1?'پایان':'بعدی')+'</button></div></div>'}function saveA(){let q=qs[idx];if(q.type==='mcq'){let x=document.querySelector('input[name=a]:checked');answers[idx]=x?+x.value:null}else if(q.type==='multi')answers[idx]=[...document.querySelectorAll('input[name=a]:checked')].map(x=>+x.value);else if(q.type==='tf'){let x=document.querySelector('input[name=a]:checked');answers[idx]=x?x.value==='true':null}else if(q.type==='blank')answers[idx]=Array.from(document.querySelectorAll('[id^=blank]')).map(x=>x.value);else if(q.type==='match')answers[idx]=Array.from({length:(q.pairs||[]).length},(_,k)=>{let v=document.getElementById('match'+k)?.value;return v===''||v==null?'':(q.pairs[+v]?.[1]??'')});else if(q.type==='dropdown')answers[idx]=document.getElementById('dropdownAns')?.value||'';else answers[idx]=document.getElementById('ans')?.value||'';localStorage.setItem('hakimestan_online_answers',JSON.stringify(answers))}function clock(){let left=Math.max(0,CFG.duration*60-Math.floor((Date.now()-started)/1000)),m=Math.floor(left/60),s=left%60,e=document.getElementById('timer');if(e){e.textContent=m+':'+String(s).padStart(2,'0');e.classList.toggle('danger',left<60)}if(left<=0)finish();else setTimeout(clock,1000)}function finish(){if(!started)return;saveA();let total=0,max=0,cc=0,pending=0,details=[];qs.forEach((q,j)=>{let r=check(q,answers[j]),full=+q.score||0,s=0;if(r===null)pending++;else if(typeof r==='number')s=full*r;else if(r){s=full;cc++}max+=full;total+=s;details.push({q:q.text,ans:answers[j],score:s,full})});let out={exam_title:EXAM.title,student,date:new Date().toISOString(),total_score:total,max_score:max,percent:max?Math.round(total/max*100):0,correct_count:cc,total_questions:qs.length,manual_pending:pending,details};window._lastResult=out;root.innerHTML='<div class="box result-box" id="resultBox"><h1>🎉 آزمون تمام شد!</h1><h2>'+esc(out.student||'دانش‌آموز')+'</h2><div class="result-score"><div class="big-score">'+out.percent+'٪</div><div class="score-detail">نمره: '+out.total_score+' از '+out.max_score+'</div></div><div class="result-stats"><div>✅ درست: <b>'+out.correct_count+'</b></div><div>❌ غلط: <b>'+(out.total_questions-out.correct_count-out.manual_pending)+'</b></div><div>📝 تشریحی معلق: <b>'+out.manual_pending+'</b></div><div>📅 '+new Date().toLocaleDateString('fa-IR')+'</div></div><h3 style="margin-top:20px">📤 ارسال نتیجه به معلم</h3><p style="font-size:.85em;opacity:.75;margin-bottom:12px">یکی از این روش‌ها رو انتخاب کن و برای معلم بفرست:</p><div class="result-actions"><button class="btn" onclick="downloadResult()">📥 دانلود فایل</button><button class="btn" onclick="copyResult()">📋 کپی متن نتیجه</button><button class="btn" onclick="downloadResultImage()">🖼️ دانلود تصویر</button><button class="btn" onclick="showQRCode()">📱 نمایش QR Code</button><button class="btn" onclick="location.reload()" style="grid-column:span 2">🔄 آزمون دوباره</button></div><div id="qrCodeBox" class="qr-box" style="display:none"><div style="font-weight:800;margin-bottom:8px">📱 معلم این کد رو با موبایل اسکن کنه</div><div id="qrCodeContainer"></div><p style="font-size:.75em;opacity:.7;margin-top:8px">این کد شامل نام، نمره و پاسخ‌های خلاصه‌ست</p></div><h3 style="margin-top:24px">📋 مرور پاسخ‌ها</h3><table><tr><th>#</th><th>سوال</th><th>نمره</th></tr>'+out.details.map((d,j)=>'<tr><td>'+(j+1)+'</td><td>'+esc(d.q)+'</td><td>'+d.score+' / '+d.full+'</td></tr>').join('')+'</table></div>'}function downloadResult(){let o=window._lastResult;if(!o){alert('نتیجه‌ای برای دانلود نیست');return}let json=JSON.stringify(o,null,2);let blob=new Blob([json],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='result-'+(o.student||'student')+'.json';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000)}function copyResult(){let o=window._lastResult;if(!o)return;let text='📊 نتیجه آزمون\n📚 '+o.exam_title+'\n👤 دانش‌آموز: '+o.student+'\n🏆 نمره: '+o.total_score+' از '+o.max_score+'\n📈 درصد: '+o.percent+'٪\n✅ پاسخ درست: '+o.correct_count+' از '+o.total_questions+'\n📅 تاریخ: '+new Date().toLocaleDateString('fa-IR')+'\n\n--- DATA ---\n'+JSON.stringify(o);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>{alert('✅ نتیجه کپی شد! می‌تونی تو واتساپ یا تلگرام بفرستی.')}).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}function fallbackCopy(text){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');alert('✅ نتیجه کپی شد!')}catch(e){alert('❌ کپی نشد. لطفاً از روش دانلود فایل استفاده کن.')}document.body.removeChild(ta)}function loadExternalScript(src){return new Promise((resolve,reject)=>{let s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}async function downloadResultImage(){let box=document.getElementById('resultBox');if(!box)return;if(!window.html2canvas){try{await loadExternalScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js')}catch(e){alert('❌ خطا در لود کتابخانه. اتصال اینترنت رو چک کن.');return}}try{let canvas=await html2canvas(box,{scale:2,backgroundColor:'#1b1008',useCORS:true});canvas.toBlob(blob=>{let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='نتیجه-'+(window._lastResult.student||'student')+'.png';document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000)},'image/png')}catch(e){alert('❌ خطا در ساخت تصویر')}}async function showQRCode(){let box=document.getElementById('qrCodeBox');if(!box)return;box.style.display='block';box.scrollIntoView({behavior:'smooth',block:'center'});let o=window._lastResult;let summary={s:o.student,t:o.exam_title,sc:o.total_score,mx:o.max_score,p:o.percent,c:o.correct_count,q:o.total_questions,d:new Date().toISOString().split('T')[0]};let qrData=JSON.stringify(summary);let container=document.getElementById('qrCodeContainer');container.innerHTML='';if(typeof qrcode==='undefined'){try{await loadExternalScript('https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js')}catch(e){container.innerHTML='<div style="color:#e74c3c">❌ خطا در لود QR</div>';return}}try{let qr=qrcode(0,'M');qr.addData(qrData);qr.make();container.innerHTML=qr.createImgTag(6,10);let img=container.querySelector('img');if(img){img.style.borderRadius='12px';img.style.background='#fff';img.style.padding='12px';img.style.display='block';img.style.margin='0 auto';img.style.maxWidth='100%'}}catch(e){container.innerHTML='<div style="color:#e74c3c">❌ خطا در ساخت QR</div>'}}renderStart();<\/script></main></body></html>`}
function grading(){return `<div class="card"><h2>تصحیح و نتایج</h2><div id="drop" class="drop" onclick="document.getElementById('resultFiles').click()">فایل‌های JSON نتیجه را اینجا بکشید یا کلیک کنید<br><span class="muted">انتخاب چند فایل امکان‌پذیر است</span></div><input id="resultFiles" class="hide" type="file" accept=".json,application/json" multiple onchange="readResults(this.files)"><div class="btnrow" style="margin-top:10px"><button class="btn" onclick="sampleResult()">بارگذاری نمونه</button><button class="btn danger" onclick="results=[];render()">پاک کردن نتایج</button></div></div>${results.length?resultTable():''}`}
function readResults(files){Promise.all([...files].map(f=>new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{try{res(JSON.parse(r.result))}catch{rej()}};r.readAsText(f)}))).then(x=>{results.push(...x.filter(r=>r&&'percent'in r));results.sort((a,b)=>b.percent-a.percent);render()}).catch(()=>alert('یکی از فایل‌ها JSON معتبر نیست.'))}function sampleResult(){results=[{exam_title:exam().title,student:'دانش‌آموز نمونه',date:new Date().toISOString(),total_score:15,max_score:20,percent:75,correct_count:15,total_questions:20,manual_pending:0,details:[]}];render()}function resultTable(){let avg=results.reduce((s,r)=>s+(+r.percent||0),0)/results.length,max=Math.max(...results.map(r=>+r.percent||0)),min=Math.min(...results.map(r=>+r.percent||0));return `<div class="grid stats"><div class="card stat"><b>${fa(results.length)}</b>دانش‌آموز</div><div class="card stat"><b>${avg.toFixed(1)}٪</b>میانگین</div><div class="card stat"><b>${fa(max)}٪</b>بالاترین</div><div class="card stat"><b>${fa(min)}٪</b>پایین‌ترین</div></div><div class="card"><div class="btnrow"><button class="btn" onclick="gradeCSV()">📊 خروجی Excel</button><button class="btn" onclick="gradePrint()">📕 کارنامه PDF</button></div><div style="overflow:auto"><table><tr><th>رتبه</th><th>نام</th><th>نمره</th><th>درصد</th><th>درست</th><th>تشریحی</th><th>تاریخ</th></tr>${results.map((r,i)=>`<tr class="${r.percent>=80?'good':r.percent>=50?'mid':'bad'}"><td>${i<3?['🥇','🥈','🥉'][i]:fa(i+1)}</td><td>${esc(r.student)}</td><td>${r.total_score} / ${r.max_score}</td><td>${r.percent}٪</td><td>${r.correct_count}</td><td>${r.manual_pending}</td><td>${esc((r.date||'').slice(0,10))}</td></tr>`).join('')}</table></div></div>`}function gradeCSV(){let rows=[['رتبه','نام','نمره','حداکثر','درصد','درست','تشریحی معلق','تاریخ'],...results.map((r,i)=>[i+1,r.student,r.total_score,r.max_score,r.percent,r.correct_count,r.manual_pending,r.date])];dl('class-results.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function gradePrint(){
  let w = open();
  if(!w) return;
  w.document.write(
    '<html dir="rtl"><head><meta charset="utf-8"><style>' +
    'body{font-family:Arial;padding:25px}' +
    'table{width:100%;border-collapse:collapse}' +
    'td,th{border:1px solid #777;padding:8px;text-align:center}' +
    'h1{text-align:center;color:#7a4400}' +
    '</style></head><body>' +
    '<h1>کارنامه کلاس — ' + esc(exam().title) + '</h1>' +
    resultTable()
      .replace(/class="grid stats"/,'')
      .replace(/class="card stat"/g,'')
      .replace(/class="card"/g,'') +
    '</body></html>'
  );
  w.document.close();
  w.print();
}

document.addEventListener('dragover',e=>{if(e.target.closest('#drop'))e.preventDefault()});document.addEventListener('drop',e=>{let d=e.target.closest('#drop');if(d){e.preventDefault();readResults(e.dataTransfer.files)}});render();
</script></body></html>
