<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>آزمون‌ساز حکیمستان</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri&family=Estedad:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&family=Lalezar&family=Markazi+Text:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#140b04,#0a0602);color:#f5edd6;font-family:Vazirmatn,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;background:#120904f2;border-bottom:1px solid #5d431c;backdrop-filter:blur(10px)}.topin{max-width:1250px;margin:auto;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.brand{color:#f5c842;font-weight:700;font-size:20px}.tabs{display:flex;gap:6px;overflow:auto}.tab,.btn{border:1px solid #694a1b;background:#211106;color:#f5edd6;border-radius:10px;padding:9px 13px}.tab.active,.btn.primary{background:#f5c842;color:#241305;border-color:#f5c842;font-weight:700}.btn.danger{background:#43150f;border-color:#8d3025}.btn.success{background:#174a2c;border-color:#2ecc71}.btnrow{display:flex;gap:8px;flex-wrap:wrap}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#1a0e07;border:1px solid #5d431c;border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 8px 30px #0004}.grid{display:grid;gap:12px}.info{grid-template-columns:repeat(6,1fr)}.two{grid-template-columns:1fr 2fr}.templates{grid-template-columns:repeat(3,1fr)}.colors{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}.exports{grid-template-columns:repeat(3,1fr)}@media(max-width:900px){.info{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.two,.templates,.exports{grid-template-columns:1fr 1fr}.colors,.stats{grid-template-columns:1fr 1fr}}@media(max-width:480px){.info,.two,.templates,.exports,.colors,.stats{grid-template-columns:1fr}}label{display:block;color:#bda282;font-size:13px;margin:6px 0}input,select,textarea{width:100%;background:#100803;color:#f5edd6;border:1px solid #65481c;border-radius:9px;padding:10px;outline:0}textarea{min-height:90px;resize:vertical}input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid #f5c842;outline-offset:2px}.qitem{border:1px solid #503815;background:#140a05;border-radius:10px;padding:10px;margin:7px 0;cursor:pointer}.qitem.active{border-color:#f5c842;background:#2a1908}.muted{color:#bda282;font-size:12px}.section{display:flex;justify-content:space-between;align-items:center;gap:8px}.options{display:grid;gap:8px}.option{display:grid;grid-template-columns:auto 1fr auto;gap:7px;align-items:center}.pairs{display:grid;gap:8px}.pair{display:grid;grid-template-columns:1fr 1fr auto;gap:7px}.fontbtn{border:1px solid #65481c;background:#211106;color:#f5edd6;border-radius:10px;padding:10px 14px}.fontbtn.active{border-color:#f5c842;color:#f5c842}.fonts{display:flex;gap:7px;flex-wrap:wrap}.range{display:grid;grid-template-columns:1fr 110px;gap:12px;align-items:center}.template{border:2px solid #604619;background:#211106;color:#f5edd6;border-radius:12px;padding:15px;text-align:center}.template.active{border-color:#f5c842}.paperwrap{display:flex;justify-content:center}.paper{width:min(780px,100%);min-height:1000px;box-shadow:0 12px 35px #0009}.paperhead{text-align:center;padding-bottom:12px;margin-bottom:15px;border-bottom:2px solid var(--p)}.paperinfo{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;border:1px solid #888;padding:8px;font-size:12px}.pq{margin:17px 0}.popt{padding:4px}.explain{font-size:12px;border-top:1px dashed #999;padding-top:5px}.export{min-height:125px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;font-size:16px}.drop{border:2px dashed #76531e;border-radius:14px;padding:35px;text-align:center}.stat{text-align:center}.stat b{display:block;font-size:25px;color:#f5c842}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #503817;text-align:center}th{color:#f5c842}.good{color:#2ecc71}.mid{color:#67a9ff}.bad{color:#e74c3c}.hide{display:none!important}.small{font-size:12px}

.badge{display:inline-block;font-size:11px;padding:2px 7px;border:1px solid #76531e;border-radius:999px;color:#f5c842;background:#211106}.insert-wrap{position:relative;text-align:center;height:18px;z-index:3}.insert-btn{width:26px;height:26px;border-radius:50%;padding:0;border:1px solid #c9941a;background:#2a1506;color:#f5c842;font-weight:700;line-height:22px;box-shadow:0 3px 10px #0006}.insert-menu{position:absolute;top:29px;left:50%;transform:translateX(-50%);min-width:180px;background:#2a1506;border:1px solid #c9941a;border-radius:10px;padding:6px;box-shadow:0 10px 25px #0009;display:grid;gap:4px}.insert-menu button{border:1px solid #604619;background:#211106;color:#f5edd6;border-radius:7px;padding:7px;text-align:right}.insert-menu button:hover{background:#3a210b}.hakim-helper{position:fixed;left:12px;bottom:12px;z-index:30;display:flex;align-items:flex-end;gap:7px;direction:ltr;transition:opacity .4s,transform .4s}.hakim-helper.hakim-hide{opacity:0;transform:translateY(8px);pointer-events:none}.hakim-avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#2a1506;border:1px solid #c9941a;font-size:21px}.hakim-bubble{max-width:240px;background:#2a1506;border:1px solid #c9941a;color:#f5edd6;border-radius:11px;padding:8px 10px;font-size:12px;box-shadow:0 7px 20px #0007;direction:rtl}.toast{position:fixed;right:50%;top:74px;transform:translateX(50%);z-index:50;background:#7b1717;color:#fff;padding:10px 16px;border-radius:9px;box-shadow:0 8px 25px #0008;opacity:0;transition:opacity .2s}.toast.show{opacity:1}
</style></head>
<body><header class="top"><div class="topin"><div class="brand">📋 آزمون‌ساز حکیمستان</div><nav class="tabs" id="tabs"></nav></div></header><main class="wrap" id="app"></main>
<script>
'use strict';
const KEY='hakimestan_azmoon_v1',STYLE_KEY='hakimestan_azmoon_style_v1';
const TYPES={mcq:'چهارگزینه‌ای',tf:'صحیح / غلط',multi:'چندپاسخی',short:'پاسخ کوتاه',blank:'جای خالی',match:'تطبیقی',dropdown:'اتصال کشویی',essay:'تشریحی'};
const FONTS=['Vazirmatn','Amiri','Lalezar','Markazi Text','Noto Naskh Arabic','Estedad'];
const TPL={classic:['کلاسیک','📜','#c9941a','#fdf6e3','#2a1a08','#7a4400','Vazirmatn',2,8,40,'solid'],modern:['مدرن','🔷','#3498db','#fff','#1a2a3a','#2980b9','Estedad',1,14,36,'solid'],ancient:['کهن','🏺','#8b5e0a','#f5e3b8','#3a2208','#5a3210','Amiri',3,4,44,'double'],minimal:['مینیمال','📄','#666','#fafafa','#222','#444','Markazi Text',0,0,36,'none'],night:['شب','🌙','#a0c8ff','#0f1a2e','#e0ecff','#7ba3cc','Vazirmatn',2,10,40,'solid'],flag:['پرچم','🇮🇷','#2ecc71','#fff','#1a3a2a','#c8102e','Noto Naskh Arabic',3,8,40,'solid']};
let data=read(KEY,{exams:[],currentExamId:null}),style=read(STYLE_KEY,{primary:'#c9941a',bg:'#fdf6e3',text:'#2a1a08',accent:'#7a4400',font:'Vazirmatn',border:2,radius:8,padding:40,fontSize:15,lineHeight:1.8,borderStyle:'solid'}),tab='questions',active=0,results=[];
function migrate(){let changed=false;(data.exams||[]).forEach(e=>(e.questions||[]).forEach(x=>{if(!x.dropdownOptions){x.dropdownOptions=['',''];changed=true}if(x.dropdownAnswer===undefined){x.dropdownAnswer='';changed=true}if(x.type==='dropdown'&&(!x.dropdownOptions||x.dropdownOptions.length<2)){x.dropdownOptions=['',''];changed=true}}));if(style.font==='Sahel')style.font='Noto Naskh Arabic';if(style.font==='Samim')style.font='Markazi Text';if(style.font==='Shabnam')style.font='Lalezar';if(changed)save()}migrate();
function read(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}}function save(){localStorage.setItem(KEY,JSON.stringify(data));localStorage.setItem(STYLE_KEY,JSON.stringify(style))}function uid(){return 'id_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fa(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}function norm(v){return String(v??'').trim().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLowerCase()}function dl(name,text,type='text/plain;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function newQ(){return{id:uid(),type:'mcq',text:'',image:'',options:['',''],answer:0,shortAnswers:[],blankAnswers:[],pairs:[['','']],dropdownOptions:['',''],dropdownAnswer:'',sampleAnswer:'',explanation:'',lesson:'18',score:1,difficulty:'متوسط'}}function render(){const tabs=[['questions','📝 سوالات'],['design','🎨 طراحی'],['preview','👁️ پیش‌نمایش'],['export','📤 خروجی'],['online','🎮 آزمون آنلاین'],['grading','✅ تصحیح']];document.getElementById('tabs').innerHTML=tabs.map(x=>`<button class="tab ${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('');const f={questions:questions,design:design,preview:preview,export:exports,online:online,grading:grading}[tab];document.getElementById('app').innerHTML=f();bind();if(tab==='questions')initHakim();save()}
function typeIcon(t){return{mcq:'🔘',tf:'✅',multi:'☑️',short:'✏️',blank:'📝',match:'🔗',dropdown:'🔽',essay:'📄'}[t]||'❓'}
function hasAnswer(x){if(x.type==='mcq')return Number.isInteger(x.answer)&&x.answer>=0&&x.answer<(x.options||[]).length&&!!norm((x.options||[])[x.answer]);if(x.type==='tf')return typeof x.answer==='boolean';if(x.type==='multi')return Array.isArray(x.answer)&&x.answer.length>0;if(x.type==='short')return (x.shortAnswers||[]).length>0;if(x.type==='blank')return (x.blankAnswers||[]).length>0;if(x.type==='match')return (x.pairs||[]).some(p=>norm(p[1]));if(x.type==='dropdown')return !!norm(x.dropdownAnswer);if(x.type==='essay')return !!norm(x.sampleAnswer);return true}
function insertButton(i){return `<div class="insert-wrap"><button class="insert-btn" onclick="event.stopPropagation();toggleInsertMenu(${i})">＋</button><div id="insertMenu${i}" class="insert-menu hide">${Object.entries(TYPES).map(([k,v])=>`<button onclick="event.stopPropagation();insertQ(${i},'${k}')">${typeIcon(k)} ${v}</button>`).join('')}</div></div>`}
function toggleInsertMenu(i){document.querySelectorAll('.insert-menu').forEach(x=>x.classList.add('hide'));document.getElementById('insertMenu'+i)?.classList.toggle('hide')}
function insertQ(i,type){let e=exam(),n=newQ();n.type=type;e.questions.splice(i+1,0,n);active=i+1;save();render();hakimSay('سوال جدید در جای انتخاب‌شده اضافه شد.')}
function validateExam(){let e=exam();if(!e.questions.length){toast('❌ اول باید حداقل یه سوال بسازی!');return false}for(let i=0;i<e.questions.length;i++){let x=e.questions[i],n=fa(i+1);if(!norm(x.text)){toast(`❌ سوال شماره ${n} متن نداره. لطفاً پرش کن.`);return false}if(x.type==='mcq'){if((x.options||[]).some(o=>!norm(o))){toast(`❌ سوال ${n} گزینه‌ی خالی داره.`);return false}if(!Number.isInteger(x.answer)){toast(`❌ برای سوال ${n} پاسخ درست رو انتخاب نکردی.`);return false}}if(x.type==='blank'&&!String(x.text||'').includes('__')){toast(`❌ سوال ${n} جای خالی باید حداقل یک __ داشته باشد.`);return false}if(x.type==='blank'&&!(x.blankAnswers||[]).length){toast(`❌ سوال ${n} جای خالی پاسخ نداره.`);return false}if(x.type==='tf'&&typeof x.answer!=='boolean'){toast(`❌ برای سوال ${n} باید صحیح یا غلط را انتخاب کنی.`);return false}if(x.type==='multi'&&(!x.answer||!x.answer.length)){toast(`❌ سوال ${n} چندگزینه‌ای باید حداقل یک پاسخ درست داشته باشد.`);return false}if(x.type==='short'&&!(x.shortAnswers||[]).length){toast(`❌ سوال ${n} پاسخ کوتاه ندارد.`);return false}if(x.type==='match'&&!(x.pairs||[]).some(p=>norm(p&&p[0])&&norm(p&&p[1]))){toast(`❌ سوال ${n} حداقل یک جفت تطبیقی کامل ندارد.`);return false}if(x.type==='dropdown'){if((x.dropdownOptions||[]).some(o=>!norm(o))){toast(`❌ سوال ${n} گزینه‌ی کشویی خالی داره.`);return false}if(!norm(x.dropdownAnswer)){toast(`❌ برای سوال ${n} پاسخ درست کشویی رو انتخاب نکردی.`);return false}}}return true}
let toastTimer=null;function toast(msg){clearTimeout(toastTimer);let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');toastTimer=setTimeout(()=>t.classList.remove('show'),3000)}
let hakimTimer=null;function hakimSay(msg){let h=document.getElementById('hakimHelper');if(!h)return;h.querySelector('.hakim-bubble').textContent=msg;h.classList.remove('hakim-hide');clearTimeout(hakimTimer);hakimTimer=setTimeout(()=>h.classList.add('hakim-hide'),5000)}
function initHakim(){setTimeout(()=>hakimSay('سلام معلم عزیز! من حکیم‌ام. آماده‌ای سوال بسازی؟'),250);}
function questions(){let e=exam();if(active>=e.questions.length)active=e.questions.length-1;const warn=x=>!hasAnswer(x);return `<div class="card"><div class="section"><h2>اطلاعات آزمون</h2><button class="btn primary" onclick="addQ()">＋ سوال جدید</button></div><div class="grid info">${inp('عنوان آزمون','title',e.title)}${inp('پایه / کلاس','grade',e.grade)}${inp('نام دبستان','school',e.school)}${inp('زمان (دقیقه)','duration',e.duration,'number')}${inp('نام معلم','teacher',e.teacher)}${inp('تاریخ','date',e.date)}</div></div><div class="grid two"><div class="card"><div class="section"><h3>📋 سوالات (${fa(e.questions.length)} سوال)</h3><button class="btn primary" onclick="addQ()">＋ سوال جدید</button></div>${e.questions.map((x,i)=>`<div class="qitem ${i===active?'active':''}" onclick="active=${i};render()"><div class="section"><span><b>${fa(i+1)}.</b> <span class="badge">${typeIcon(x.type)} ${esc(TYPES[x.type])}</span></span>${warn(x)?'<span title="پاسخ صحیح ثبت نشده">⚠️</span>':''}</div><div class="muted">${esc(x.text).slice(0,75)||'بدون متن'}</div></div>${i<e.questions.length-1?insertButton(i):''}`).join('')}</div><div class="card">${editor(q())}</div></div><div id="hakimHelper" class="hakim-helper hakim-hide"><div class="hakim-avatar">🧙‍♂️</div><div class="hakim-bubble">متن راهنما...</div></div>`}function inp(label,key,val,type='text'){return `<div><label>${label}</label><input type="${type}" data-exam="${key}" value="${esc(val)}"></div>`}
function editor(x){let extra='';if(x.type==='mcq'||x.type==='multi')extra=`<label>گزینه‌ها</label><div class="options">${x.options.map((o,i)=>`<div class="option"><input type="${x.type==='multi'?'checkbox':'radio'}" name="correct" ${x.type==='multi'?((x.answer||[]).includes(i)?'checked':''):(x.answer===i?'checked':'')} onchange="correct(${i},this.checked)"><input data-opt="${i}" value="${esc(o)}"><button class="btn danger" onclick="delOpt(${i})">✖</button></div>`).join('')}</div><button class="btn" onclick="addOpt()" ${x.options.length>=6?'disabled':''}>＋ افزودن گزینه</button>`;if(x.type==='tf')extra=`<div class="btnrow"><button class="btn ${x.answer===true?'success':''}" onclick="field('answer',true)">✅ صحیح</button><button class="btn ${x.answer===false?'success':''}" onclick="field('answer',false)">❌ غلط</button></div>`;if(x.type==='short')extra=`<label>پاسخ‌های درست (با کاما)</label><input data-key="shortAnswers" value="${esc((x.shortAnswers||[]).join(', '))}">`;if(x.type==='blank')extra=`<label>پاسخ‌های جای خالی (با کاما)</label><input data-key="blankAnswers" value="${esc((x.blankAnswers||[]).join(', '))}"><div class="muted">در متن سوال از __ استفاده کن.</div>`;if(x.type==='match')extra=`<label>جفت‌های تطبیقی</label><div class="pairs">${x.pairs.map((p,i)=>`<div class="pair"><input data-pair="${i},0" value="${esc(p[0])}" placeholder="ستون الف"><input data-pair="${i},1" value="${esc(p[1])}" placeholder="ستون ب"><button class="btn danger" onclick="delPair(${i})">✖</button></div>`).join('')}</div><button class="btn" onclick="addPair()">＋ جفت</button>`;if(x.type==='dropdown')extra=`<label>گزینه‌های لیست کشویی</label><div id="dropdownOptionsBox" class="options">${(x.dropdownOptions||['','']).map((o,i)=>`<div class="option"><span class="muted">${fa(i+1)}</span><input data-dropdown-opt="${i}" value="${esc(o)}"><button class="btn danger" onclick="delDropdownOption(${i})">✖</button></div>`).join('')}</div><button class="btn" onclick="addDropdownOption()">＋ افزودن گزینه</button><label>پاسخ درست</label><select data-key="dropdownAnswer" ><option value="">انتخاب کنید...</option>${(x.dropdownOptions||[]).map(o=>`<option value="${esc(o)}" ${x.dropdownAnswer===o?'selected':''}>${esc(o)||'گزینه خالی'}</option>`).join('')}</select>`;if(x.type==='essay')extra=`<label>پاسخ نمونه</label><textarea data-key="sampleAnswer">${esc(x.sampleAnswer)}</textarea>`;return `<div class="section"><h2>ویرایش سوال ${fa(active+1)}</h2><button class="btn danger" onclick="delQ()">🗑️ حذف سوال</button></div><label>نوع سوال</label><select data-key="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${x.type===k?'selected':''}>${v}</option>`).join('')}</select><label>متن سوال</label><textarea data-key="text">${esc(x.text)}</textarea><label>تصویر سوال (URL یا مسیر محلی)</label><input data-key="image" value="${esc(x.image)}">${extra}<label>توضیح آموزشی</label><textarea data-key="explanation">${esc(x.explanation)}</textarea><div class="grid" style="grid-template-columns:repeat(3,1fr)"><div><label>درس</label><select data-key="lesson">${[18,19,20,21].map(v=>`<option ${x.lesson==v?'selected':''}>${v}</option>`).join('')}</select></div><div><label>بارم</label><input type="number" min="0" step=".25" data-key="score" value="${x.score}"></div><div><label>دشواری</label><select data-key="difficulty">${['آسان','متوسط','دشوار'].map(v=>`<option ${x.difficulty===v?'selected':''}>${v}</option>`).join('')}</select></div></div>`}function bind(){document.querySelectorAll('[data-exam]').forEach(el=>el.oninput=()=>{let v=el.type==='number'?+el.value:el.value;exam()[el.dataset.exam]=v;save()});document.querySelectorAll('[data-online]').forEach(el=>el.oninput=()=>{let k=el.dataset.online,v=el.type==='number'?+el.value:el.value;if(k==='random'||k==='requireName')v=String(v)==='true';exam()[k]=v;save();if(el.tagName==='SELECT')render()});document.querySelectorAll('[data-key]').forEach(el=>{let saveKey=()=>{let k=el.dataset.key,v=el.type==='number'?+el.value:el.value;if(k==='shortAnswers'||k==='blankAnswers')v=v.split(',').map(norm).filter(Boolean);q()[k]=v;save()};el.oninput=saveKey;el.onchange=()=>{saveKey();if(el.dataset.key==='type')render()}});document.querySelectorAll('[data-opt]').forEach(el=>el.oninput=()=>{q().options[+el.dataset.opt]=el.value;save()});document.querySelectorAll('[data-pair]').forEach(el=>el.oninput=()=>{let [i,j]=el.dataset.pair.split(',').map(Number);q().pairs[i][j]=el.value;save()});document.querySelectorAll('[data-dropdown-opt]').forEach(el=>el.oninput=()=>{let i=+el.dataset.dropdownOpt;q().dropdownOptions[i]=el.value;if(q().dropdownAnswer&&!q().dropdownOptions.includes(q().dropdownAnswer))q().dropdownAnswer='';let sel=document.querySelector('[data-key="dropdownAnswer"]');if(sel){sel.innerHTML='<option value="">انتخاب کنید...</option>'+q().dropdownOptions.map(o=>`<option value="${esc(o)}" ${q().dropdownAnswer===o?'selected':''}>${esc(o)||'گزینه خالی'}</option>`).join('')}save()})}function addPair(){if(q().pairs.length>=10)return;q().pairs.push(['','']);save();render()}function delPair(i){if(q().pairs.length<=1)return;q().pairs.splice(i,1);save();render()}function addDropdownOption(){if(q().dropdownOptions.length>=6)return;q().dropdownOptions.push('');save();render()}function delDropdownOption(i){if(q().dropdownOptions.length<=2)return;q().dropdownOptions.splice(i,1);if(q().dropdownAnswer&&!q().dropdownOptions.includes(q().dropdownAnswer))q().dropdownAnswer='';save();render()}function addQ(){let e=exam();e.questions.push(newQ());active=e.questions.length-1;save();render();hakimSay(e.questions.length===2?'آفرین! حالا گزینه‌ها رو پر کن. یادت باشه حداقل ۲ گزینه لازمه.':e.questions.length===5?'عالی پیش می‌ری! هر ۵ سوال یکی از انواع مختلف رو امتحان کن.':e.questions.length===10?'معرکه! ۱۰ سوال داری. حالا می‌تونی آزمون بگیری.':'سوال جدید اضافه شد. فیلدهایش را کامل کن.')}function design(){return `<div class="card"><h2>قالب‌های آماده</h2><div class="grid templates">${Object.entries(TPL).map(([k,t])=>`<button class="template ${style.template===k?'active':''}" onclick="applyTpl('${k}')"><b style="font-size:25px">${t[1]}</b><br>${t[0]}<div class="muted">${t[6]}</div></button>`).join('')}</div></div><div class="card"><h2>فونت</h2><div class="fonts">${FONTS.map(f=>`<button class="fontbtn ${style.font===f?'active':''}" style="font-family:${f}" onclick="style.font='${f}';save();render()">${f}</button>`).join('')}</div>${slider('اندازه فونت','fontSize',10,22,1)}${slider('فاصله خطوط','lineHeight',1.2,2.5,.1)}</div><div class="card"><h2>رنگ‌ها</h2><div class="grid colors">${[['primary','رنگ اصلی'],['bg','رنگ پس‌زمینه'],['text','رنگ متن'],['accent','رنگ تأکید']].map(a=>`<div><label>${a[1]}</label><input type="color" value="${style[a[0]]}" oninput="style.${a[0]}=this.value;save();renderPreviewOnly()"></div>`).join('')}</div></div><div class="card"><h2>کادر و حاشیه</h2>${slider('ضخامت حاشیه','border',0,8,1)}${slider('گردی گوشه‌ها','radius',0,30,1)}${slider('فاصله داخلی','padding',10,80,1)}</div>`}
function slider(label,k,min,max,step){return `<div class="range"><label>${label}</label><div><input type="range" min="${min}" max="${max}" step="${step}" value="${style[k]}" oninput="style.${k}=+this.value;save();this.nextElementSibling.textContent=this.value;renderPreviewOnly()"><span>${style[k]}</span></div></div>`}function applyTpl(k){let t=TPL[k];style={...style,primary:t[2],bg:t[3],text:t[4],accent:t[5],font:t[6],border:t[7],radius:t[8],padding:t[9],borderStyle:t[10],template:k};save();render()}function preview(){return `<div class="paperwrap">${paper(true)}</div>`}function renderPreviewOnly(){if(tab==='preview')render()}
function paper(answers){let e=exam();return `<article class="paper" id="paper" style="--p:${style.primary};font-family:${style.font},sans-serif;font-size:${style.fontSize}px;line-height:${style.lineHeight};background:${style.bg};color:${style.text};padding:${style.padding}px;border:${style.border}px ${style.borderStyle} ${style.primary};border-radius:${style.radius}px"><header class="paperhead"><h1>${esc(e.title||'آزمون')}</h1><div>${esc(e.grade)}${e.school?' — '+esc(e.school):''}</div></header><div class="paperinfo"><span>نام: ................</span><span>تاریخ: ${esc(e.date)}</span><span>زمان: ${fa(e.duration)} دقیقه</span><span>معلم: ${esc(e.teacher)}</span></div>${e.questions.map((x,i)=>printQ(x,i,answers)).join('')}<footer style="text-align:center;margin-top:30px;border-top:1px solid #999;padding-top:9px">ساخته‌شده با آزمون‌ساز حکیمستان</footer></article>`}
function printQ(x,i,answers){let b='';if(x.image)b+=`<img src="${esc(x.image)}" alt="تصویر سوال" style="max-width:100%;display:block;margin:8px auto">`;if(x.type!=='blank')b+=`<div class="qtext">${esc(x.text)}</div>`;if(x.type==='mcq'||x.type==='multi')b+=(x.options||[]).map((o,j)=>`<div class="popt">${x.type==='multi'?'☐':'○'} ${String.fromCharCode(65+j)}. ${esc(o)} ${answers&&((x.type==='multi'?(x.answer||[]).includes(j):x.answer===j)?'✓':'')}</div>`).join('');else if(x.type==='tf')b+=`<div class="popt">☐ صحیح　☐ غلط ${answers?' پاسخ: '+(x.answer?'صحیح':'غلط'):''}</div>`;else if(x.type==='short')b+=`<div class="popt">پاسخ: ${answers?esc((x.shortAnswers||[]).join(' / ')):'................................'}</div>`;else if(x.type==='blank')b+=`<div class="popt">${esc(x.text).replace(/__/g,'________________')}</div>`;else if(x.type==='match')b+=(x.pairs||[]).map((p,j)=>`<div class="popt">${fa(j+1)}. ${esc(p[0])} ↔ ${answers?esc(p[1]):'................'}</div>`).join('');else if(x.type==='dropdown')b+=`<div class="popt">${answers?'انتخاب: '+esc(x.dropdownAnswer||'—'):'انتخاب: '+(x.dropdownOptions||[]).map(o=>`<span style="display:inline-block;border:1px solid #999;padding:3px 12px;margin:2px">${esc(o)||'...'}</span>`).join('')}</div>`;else b+='<div style="min-height:100px">پاسخ: ....................................................................</div>';if(answers&&x.explanation)b+=`<div class="explain">${esc(x.explanation)}</div>`;return `<div class="pq"><b>${fa(i+1)}) <small>(${fa(x.score)} نمره)</small></b>${b}</div>`}function exports(){let a=[['📘','فایل Word','word()'],['📕','PDF / چاپ','printWin(false)'],['🖼️','تصویر PNG بدون پاسخ','png(false)'],['🖼️','تصویر PNG با پاسخ','png(true)'],['🖨️','چاپ مستقیم','printWin(false)'],['💾','پشتیبان JSON','backup()'],['📂','بازیابی JSON','pickJSON()'],['📊','CSV / Excel','csv()'],['🔑','کلید پاسخ','printWin(true)'],['📄','برگه خام','printWin(false)']];return `<div class="grid exports">${a.map(x=>`<button class="card export" onclick="${x[2]}">${x[0]}<b>${x[1]}</b></button>`).join('')}</div><input id="jsonIn" class="hide" type="file" accept=".json,application/json">`}
const PAPER_CSS=`*{box-sizing:border-box}html,body{margin:0;padding:0;background:#eee}body{font-family:Arial,sans-serif;direction:rtl}.paper{width:190mm;min-height:277mm;margin:0 auto;background:#fff;box-shadow:0 0 8px #aaa}.paperhead{text-align:center;border-bottom:2px solid var(--p);padding-bottom:12px;margin-bottom:12px}.paperinfo{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;border:1px solid #bbb;padding:9px;margin-bottom:14px}.pq{padding:12px 0;border-bottom:1px solid #ddd;page-break-inside:avoid}.qtext{margin:7px 0 9px}.popt{padding:5px 0}.explain{margin-top:7px;padding:7px;border-right:3px solid var(--p);background:#f5f0e8}@media print{html,body{background:#fff}.paper{box-shadow:none;width:auto;margin:0}}`;function exportPaperHTML(ans){return `<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(exam().title||'آزمون')}</title><style>${PAPER_CSS}</style></head><body>${paper(ans)}</body></html>`}function word(){if(!validateExam())return;hakimSay('خروجی Word آماده شد.');dl('azmoon-saz.doc',exportPaperHTML(false),'application/msword')}function printWin(ans){if(!validateExam())return;hakimSay('خروجی چاپ آماده شد.');let w=open();if(!w)return;w.document.write(exportPaperHTML(ans));w.document.close();w.onload=()=>w.print()}async function png(showAnswers=false){if(!validateExam())return;let tempEl=document.createElement('div');tempEl.innerHTML=paper(showAnswers);let p=tempEl.firstElementChild;tempEl.style.position='fixed';tempEl.style.left='-100000px';tempEl.style.top='0';document.body.appendChild(tempEl);if(!window.html2canvas){tempEl.remove();return alert('html2canvas در دسترس نیست.')}try{const c=await html2canvas(p,{scale:2,useCORS:true});c.toBlob(b=>{if(!b){tempEl.remove();return}const url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=showAnswers?'azmoon-saz-answer.png':'azmoon-saz.png';a.click();setTimeout(()=>{URL.revokeObjectURL(url);tempEl.remove()},1000)})}catch(err){tempEl.remove();throw err}}function backup(){if(!validateExam())return;dl('azmoon-saz-backup.json',JSON.stringify({version:1,exams:data.exams,currentExamId:data.currentExamId,style},null,2),'application/json;charset=utf-8')}function pickJSON(){const i=document.getElementById('jsonIn');i.onchange=()=>{const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!x.exams)throw 0;data=x.exams?x:{exams:[x.exam],currentExamId:x.exam.id};style={...style,...(x.style||{})};save();render()}catch{alert('فایل JSON معتبر نیست.')}};r.readAsText(i.files[0])};i.click()}function csv(){if(!validateExam())return;let rows=[['شماره','نوع','متن','پاسخ','توضیح','درس','نمره'],...exam().questions.map((x,i)=>[i+1,TYPES[x.type],x.text,answer(x),x.explanation,x.lesson,x.score])];dl('azmoon-saz.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function answer(x){if(x.type==='mcq')return x.options?.[x.answer]||'';if(x.type==='multi')return(x.answer||[]).map(i=>x.options?.[i]||'').join(' | ');if(x.type==='tf')return x.answer?'صحیح':'غلط';if(x.type==='short')return(x.shortAnswers||[]).join(' | ');if(x.type==='blank')return(x.blankAnswers||[]).join(' | ');if(x.type==='match')return(x.pairs||[]).map(p=>p.join(' ↔ ')).join(' | ');if(x.type==='dropdown')return x.dropdownAnswer||'';return x.sampleAnswer||''}
function online(){let e=exam();return `<div class="card"><h2>آزمون آنلاین</h2><div class="grid info"><div><label>زمان (دقیقه)</label><input data-online="onlineDuration" type="number" value="${e.onlineDuration||15}"></div><div><label>ترتیب</label><select data-online="random"><option value="false" ${!e.random?'selected':''}>به ترتیب</option><option value="true" ${e.random?'selected':''}>تصادفی</option></select></div><div><label>نمایش پاسخ درست</label><select data-online="showCorrect"><option value="end" ${e.showCorrect!=='after'?'selected':''}>خیر، فقط پایان</option><option value="after" ${e.showCorrect==='after'?'selected':''}>بله بعد از پاسخ</option></select></div><div><label>نام اجباری</label><select data-online="requireName"><option value="true" ${e.requireName!==false?'selected':''}>بله</option><option value="false" ${e.requireName===false?'selected':''}>خیر</option></select></div></div><div class="btnrow"><button class="btn primary" onclick="buildOnline()">🎮 ساخت فایل آزمون آنلاین</button><button class="btn" onclick="previewOnline()">👁️ پیش‌نمایش آزمون</button></div></div>`}
function buildOnline(){if(!validateExam())return;hakimSay('فایل آزمون آنلاین آماده شد.');dl('azmoon-online.html',onlineHTML(),'text/html;charset=utf-8')}function previewOnline(){if(!validateExam())return;let w=open();w.document.write(onlineHTML());w.document.close()}function onlineHTML(){let e=JSON.parse(JSON.stringify(exam())),cfg={duration:+e.onlineDuration||15,random:!!e.random,showCorrect:e.showCorrect||'end',requireName:e.requireName!==false};const safe=v=>JSON.stringify(v).replace(/</g,'\\u003c').replace(/>/g,'\\u003e').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');return `<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(e.title)}</title><style>*{box-sizing:border-box}body{margin:0;background:#140b04;color:#f5edd6;font-family:Arial,sans-serif}main{max-width:850px;margin:auto;padding:18px}.box{background:#1b1008;border:1px solid #76521e;border-radius:16px;padding:20px}.q{background:#fff;color:#241305;padding:20px;border-radius:12px}.opt{display:block;padding:11px;margin:7px 0;border:1px solid #ccc;border-radius:8px}.top{display:flex;justify-content:space-between}.timer{font-size:21px}.danger{color:#e74c3c}.bar{height:8px;background:#39230d;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:#f5c842}.btn{padding:11px 16px;border-radius:9px;border:1px solid #805a20;background:#f5c842;color:#241305;font-weight:bold}.nav{display:flex;justify-content:space-between;margin-top:15px;gap:8px}.feedback{margin-top:10px;padding:9px;border-radius:8px}.ok{background:#d9f2df;color:#175b28}.bad{background:#f7d7d7;color:#7b1717}input,textarea,select{font:inherit;max-width:100%}table{width:100%;border-collapse:collapse}td,th{padding:7px;border-bottom:1px solid #777;text-align:right}</style></head><body><main id="root"></main><script>const EXAM=${safe(e)},CFG=${safe(cfg)};let qs=[...EXAM.questions],idx=0,answers=Array(qs.length).fill(null),started=0,student='';if(CFG.random)qs.sort(()=>Math.random()-.5);const root=document.getElementById('root');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function norm(v){return String(v??'').trim().replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/\s+/g,' ').toLowerCase()}function eq(a,b){a=[...(a||[])].map(String).sort();b=[...(b||[])].map(String).sort();return a.length===b.length&&a.every((v,i)=>v===b[i])}function check(q,a){if(a===null||a===undefined||a==='')return null;if(q.type==='mcq'||q.type==='tf')return a===q.answer;if(q.type==='multi')return eq(a,q.answer||[]);if(q.type==='short')return(q.shortAnswers||[]).map(norm).includes(norm(a));if(q.type==='blank'){let e=q.blankAnswers||[],v=Array.isArray(a)?a:[a];return e.length===v.length&&e.every((x,i)=>norm(x)===norm(v[i]));}if(q.type==='match'){if(!Array.isArray(a))return false;let n=(q.pairs||[]).length;if(!n)return null;return a.reduce((z,v,j)=>z+(norm(v)===norm(q.pairs[j]?.[1])?1:0),0)/n}if(q.type==='dropdown')return norm(a)===norm(q.dropdownAnswer);return null}function feedback(q,a){if(CFG.showCorrect!=='after')return '';let r=check(q,a);if(r===null)return '';if(r===true||r===1)return '<div class="feedback ok">✓ پاسخ درست است.</div>';if(r===false||r===0)return '<div class="feedback bad">✗ پاسخ نادرست است.</div>';return '<div class="feedback">درصد تطبیق: '+Math.round(r*100)+'٪</div>'}function start(){student=document.getElementById('student').value.trim();if(CFG.requireName&&!student)return alert('نام دانش‌آموز را وارد کن.');started=Date.now();renderQ();clock()}function renderStart(){root.innerHTML='<div class="box"><h1>'+esc(EXAM.title)+'</h1><p>'+esc(EXAM.grade||'')+' '+esc(EXAM.school||'')+'</p><label>نام دانش‌آموز '+(CFG.requireName?'*':'(اختیاری)')+'</label><input id="student" style="width:100%;padding:12px;margin:8px 0"><button class="btn" onclick="start()">شروع آزمون</button></div>'}function renderQ(){let q=qs[idx],a=answers[idx],b='';if(q.type==='mcq'||q.type==='multi')b=(q.options||[]).map((o,j)=>'<label class="opt"><input type="'+(q.type==='multi'?'checkbox':'radio')+'" name="a" value="'+j+'" '+(q.type==='multi'?(a||[]).includes(j)?'checked':'':a===j?'checked':'')+' onchange="saveA()"> '+String.fromCharCode(65+j)+'. '+esc(o)+'</label>').join('');else if(q.type==='tf')b='<label class="opt"><input type="radio" name="a" value="true" '+(a===true?'checked':'')+' onchange="saveA()"> صحیح</label><label class="opt"><input type="radio" name="a" value="false" '+(a===false?'checked':'')+' onchange="saveA()"> غلط</label>';else if(q.type==='blank'){let n=(q.blankAnswers||[]).length||1;b=Array.from({length:n},(_,k)=>'<input class="opt" id="blank'+k+'" placeholder="جای خالی '+(k+1)+'" value="'+esc(Array.isArray(a)?a[k]||'':k===0&&!Array.isArray(a)?a||'':'')+'" oninput="saveA()">').join('')}else if(q.type==='match'){let pairs=q.pairs||[];b=pairs.map((p,k)=>'<div class="opt"><b>'+esc(p[0])+'</b> <select id="match'+k+'" onchange="saveA()"><option value="">انتخاب کنید</option>'+pairs.map((z,j)=>'<option value="'+j+'" '+(Array.isArray(a)&&String(a[k])===String(z[1])?'selected':'')+'>'+esc(z[1])+'</option>').join('')+'</select></div>').join('')}else if(q.type==='dropdown'){b='<select id="dropdownAns" class="opt" onchange="saveA()"><option value="">انتخاب کنید...</option>'+(q.dropdownOptions||[]).map(o=>'<option value="'+esc(o)+'" '+(norm(a)===norm(o)?'selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'}else b='<textarea id="ans" style="width:100%;min-height:120px" oninput="saveA()">'+esc(Array.isArray(a)?a.join(','):a||'')+'</textarea>';root.innerHTML='<div class="box"><div class="top"><b>سوال '+(idx+1)+' از '+qs.length+'</b><b id="timer" class="timer"></b></div><div class="bar"><i style="width:'+((idx+1)/qs.length*100)+'%"></i></div><div class="q"><h2>'+esc(q.type==='blank'?q.text.replace(/__/g,'_____'):q.text)+'</h2>'+b+feedback(q,a)+'</div><div class="nav"><button class="btn" onclick="saveA();idx=Math.max(0,idx-1);renderQ()">قبلی</button><button class="btn" onclick="saveA();'+(idx===qs.length-1?'finish()':'idx++;renderQ()')+'">'+(idx===qs.length-1?'پایان':'بعدی')+'</button></div></div>'}function saveA(){let q=qs[idx];if(q.type==='mcq'){let x=document.querySelector('input[name=a]:checked');answers[idx]=x?+x.value:null}else if(q.type==='multi')answers[idx]=[...document.querySelectorAll('input[name=a]:checked')].map(x=>+x.value);else if(q.type==='tf'){let x=document.querySelector('input[name=a]:checked');answers[idx]=x?x.value==='true':null}else if(q.type==='blank')answers[idx]=Array.from(document.querySelectorAll('[id^=blank]')).map(x=>x.value);else if(q.type==='match')answers[idx]=Array.from({length:(q.pairs||[]).length},(_,k)=>{let v=document.getElementById('match'+k)?.value;return v===''||v==null?'':(q.pairs[+v]?.[1]??'')});else if(q.type==='dropdown')answers[idx]=document.getElementById('dropdownAns')?.value||'';else answers[idx]=document.getElementById('ans')?.value||'';localStorage.setItem('hakimestan_online_answers',JSON.stringify(answers))}function clock(){let left=Math.max(0,CFG.duration*60-Math.floor((Date.now()-started)/1000)),m=Math.floor(left/60),s=left%60,e=document.getElementById('timer');if(e){e.textContent=m+':'+String(s).padStart(2,'0');e.classList.toggle('danger',left<60)}if(left<=0)finish();else setTimeout(clock,1000)}function finish(){if(!started)return;saveA();let total=0,max=0,cc=0,pending=0,details=[];qs.forEach((q,j)=>{let r=check(q,answers[j]),full=+q.score||0,s=0;if(r===null)pending++;else if(typeof r==='number')s=full*r;else if(r){s=full;cc++}max+=full;total+=s;details.push({q:q.text,ans:answers[j],score:s,full})});let out={exam_title:EXAM.title,student,date:new Date().toISOString(),total_score:total,max_score:max,percent:max?Math.round(total/max*100):0,correct_count:cc,total_questions:qs.length,manual_pending:pending,details};root.innerHTML='<div class="box"><h1>نتیجه آزمون</h1><h2>'+esc(out.student||'')+'</h2><p>نمره: '+out.total_score+' از '+out.max_score+' — '+out.percent+'٪</p><p>پاسخ درست: '+out.correct_count+' — تشریحی/دستی: '+out.manual_pending+'</p><button class="btn" onclick="downloadResult('+JSON.stringify(out).replace(/</g,'\\u003c')+')">دانلود JSON نتیجه</button><h3>مرور</h3><table><tr><th>#</th><th>سوال</th><th>نمره</th></tr>'+out.details.map((d,j)=>'<tr><td>'+(j+1)+'</td><td>'+esc(d.q)+'</td><td>'+d.score+' / '+d.full+'</td></tr>').join('')+'</table></div>'}function downloadResult(o){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:'application/json'}));a.download='result-'+(o.student||'student')+'.json';a.click()}renderStart();<\/script></main></body></html>`}
function grading(){return `<div class="card"><h2>تصحیح و نتایج</h2><div id="drop" class="drop" onclick="document.getElementById('resultFiles').click()">فایل‌های JSON نتیجه را اینجا بکشید یا کلیک کنید<br><span class="muted">انتخاب چند فایل امکان‌پذیر است</span></div><input id="resultFiles" class="hide" type="file" accept=".json,application/json" multiple onchange="readResults(this.files)"><div class="btnrow" style="margin-top:10px"><button class="btn" onclick="sampleResult()">بارگذاری نمونه</button><button class="btn danger" onclick="results=[];render()">پاک کردن نتایج</button></div></div>${results.length?resultTable():''}`}
function readResults(files){Promise.all([...files].map(f=>new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>{try{res(JSON.parse(r.result))}catch{rej()}};r.readAsText(f)}))).then(x=>{results.push(...x.filter(r=>r&&'percent'in r));results.sort((a,b)=>b.percent-a.percent);render()}).catch(()=>alert('یکی از فایل‌ها JSON معتبر نیست.'))}function sampleResult(){results=[{exam_title:exam().title,student:'دانش‌آموز نمونه',date:new Date().toISOString(),total_score:15,max_score:20,percent:75,correct_count:15,total_questions:20,manual_pending:0,details:[]}];render()}function resultTable(){let avg=results.reduce((s,r)=>s+(+r.percent||0),0)/results.length,max=Math.max(...results.map(r=>+r.percent||0)),min=Math.min(...results.map(r=>+r.percent||0));return `<div class="grid stats"><div class="card stat"><b>${fa(results.length)}</b>دانش‌آموز</div><div class="card stat"><b>${avg.toFixed(1)}٪</b>میانگین</div><div class="card stat"><b>${fa(max)}٪</b>بالاترین</div><div class="card stat"><b>${fa(min)}٪</b>پایین‌ترین</div></div><div class="card"><div class="btnrow"><button class="btn" onclick="gradeCSV()">📊 خروجی Excel</button><button class="btn" onclick="gradePrint()">📕 کارنامه PDF</button></div><div style="overflow:auto"><table><tr><th>رتبه</th><th>نام</th><th>نمره</th><th>درصد</th><th>درست</th><th>تشریحی</th><th>تاریخ</th></tr>${results.map((r,i)=>`<tr class="${r.percent>=80?'good':r.percent>=50?'mid':'bad'}"><td>${i<3?['🥇','🥈','🥉'][i]:fa(i+1)}</td><td>${esc(r.student)}</td><td>${r.total_score} / ${r.max_score}</td><td>${r.percent}٪</td><td>${r.correct_count}</td><td>${r.manual_pending}</td><td>${esc((r.date||'').slice(0,10))}</td></tr>`).join('')}</table></div></div>`}function gradeCSV(){let rows=[['رتبه','نام','نمره','حداکثر','درصد','درست','تشریحی معلق','تاریخ'],...results.map((r,i)=>[i+1,r.student,r.total_score,r.max_score,r.percent,r.correct_count,r.manual_pending,r.date])];dl('class-results.csv','\uFEFF'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function gradePrint(){let w=open();w.document.write('<html dir="rtl"><meta charset="utf-8"><style>body{font-family:Arial;padding:25px}table{width:100%;border-collapse:collapse}td,th{border:1px solid #777;padding:8px;text-align:center}</style><h1>کارنامه کلاس — '+esc(exam().title)+'</h1>'+resultTable().replace(/class="grid stats"/,'').replace(/class="card stat"/g,'').replace(/class="card"/g,'')+'</html>');w.document.close();w.print()}
document.addEventListener('dragover',e=>{if(e.target.closest('#drop'))e.preventDefault()});document.addEventListener('drop',e=>{let d=e.target.closest('#drop');if(d){e.preventDefault();readResults(e.dataTransfer.files)}});render();initHakim();
</script></body></html>
