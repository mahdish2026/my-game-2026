<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل معلم — فتح کهن دیار ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(180deg, #140b04, #0a0602);
    color: #f5edd6;
    min-height: 100vh;
    padding: 20px 16px;
    direction: rtl;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #f5c842;
    margin-bottom: 8px;
    font-size: 1.5rem;
  }
  .subtitle {
    text-align: center;
    color: #bda282;
    font-size: 0.8rem;
    margin-bottom: 24px;
  }

  /* ===== صفحه رمز ===== */
  .login-screen {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
  }
  .login-box {
    max-width: 400px;
    width: 100%;
    background: linear-gradient(145deg, #2a1506, #1b0c03);
    border: 2px solid #c9941a;
    border-radius: 20px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 15px 50px rgba(0,0,0,0.7);
  }
  .login-icon {
    font-size: 3rem;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 15px rgba(245,200,66,0.5));
  }
  .login-title {
    color: #f5c842;
    font-size: 1.1rem;
    font-weight: 900;
    margin-bottom: 6px;
  }
  .login-sub {
    color: #bda282;
    font-size: 0.75rem;
    margin-bottom: 20px;
    line-height: 1.6;
  }
  .login-input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 14px;
    border: 1.5px solid rgba(201,148,26,0.4);
    background: rgba(0,0,0,0.4);
    color: #f5edd6;
    font-family: inherit;
    font-size: 1.1rem;
    text-align: center;
    letter-spacing: 4px;
    transition: all 0.3s;
    outline: none;
  }
  .login-input:focus {
    border-color: #f5c842;
    box-shadow: 0 0 15px rgba(245,200,66,0.3);
  }
  .login-btn {
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    background: linear-gradient(135deg, #c9941a, #f5c842);
    color: #120500;
    border: none;
    border-radius: 30px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(245,200,66,0.3);
    transition: all 0.2s;
  }
  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(245,200,66,0.5);
  }
  .login-btn:active {
    transform: scale(0.97);
  }
  .login-error {
    color: #e74c3c;
    font-size: 0.75rem;
    margin-top: 12px;
    font-weight: 700;
    display: none;
  }
  .login-error.show { display: block; }
  .login-hint {
    color: #5a4028;
    font-size: 0.65rem;
    margin-top: 16px;
    line-height: 1.6;
  }

  /* ===== پنل اصلی ===== */
  #mainPanel { display: none; }
  #mainPanel.show { display: block; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-box {
    background: linear-gradient(145deg, #2a1506, #1b0c03);
    border: 1.5px solid #c9941a;
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .stat-box .num {
    font-size: 2rem;
    font-weight: 900;
    color: #f5c842;
    display: block;
  }
  .stat-box .label {
    font-size: 0.7rem;
    color: #bda282;
    margin-top: 4px;
    font-weight: 700;
  }
  .section-title {
    color: #f5c842;
    font-size: 1.1rem;
    font-weight: 800;
    margin: 24px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid rgba(201,148,26,0.3);
  }
  .lesson-item {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(201,148,26,0.2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .lesson-name {
    font-size: 0.85rem;
    font-weight: 800;
    color: #fff3b0;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lesson-pct { font-size: 0.9rem; color: #f5c842; }
  .lesson-bar {
    height: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .lesson-fill {
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
  }
  .lesson-stat {
    font-size: 0.7rem;
    color: #bda282;
    text-align: right;
  }
  .students-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    overflow: hidden;
    font-size: 0.8rem;
  }
  .students-table th {
    background: linear-gradient(135deg, #2a1506, #1b0c03);
    color: #f5c842;
    padding: 12px 8px;
    font-weight: 800;
    text-align: center;
    border-bottom: 2px solid #c9941a;
  }
  .students-table td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid rgba(201,148,26,0.1);
  }
  .students-table tr:hover { background: rgba(245,200,66,0.05); }
  .students-table tr:last-child td { border-bottom: none; }
  .score-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.75rem;
  }
  .score-high { background: rgba(46,204,113,0.2); color: #2ecc71; }
  .score-mid { background: rgba(52,152,219,0.2); color: #3498db; }
  .score-low { background: rgba(231,76,60,0.2); color: #e74c3c; }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #bda282;
    font-size: 0.9rem;
  }
  .refresh-btn {
    display: block;
    margin: 24px auto 0;
    padding: 12px 32px;
    background: linear-gradient(135deg, #c9941a, #f5c842);
    color: #120500;
    border: none;
    border-radius: 30px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(245,200,66,0.3);
  }
  .refresh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(245,200,66,0.5);
  }
 .export-btn {
  display: block;
  margin: 12px auto 0;
  padding: 12px 32px;
  background: linear-gradient(135deg, #27ae60, #2ecc71);
  color: #fff;
  border: none;
  border-radius: 30px;
  font-family: inherit;
  font-size: 0.9rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(46,204,113,0.3);
  transition: all 0.2s;
}
.export-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(46,204,113,0.5);
}
.export-btn:active {
  transform: scale(0.97);
}
  .loading { text-align: center; padding: 40px; color: #f5c842; }
  .last-update {
    text-align: center;
    color: #bda282;
    font-size: 0.7rem;
    margin-top: 20px;
  }
  .commander-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.65rem;
    background: rgba(155,89,182,0.2);
    color: #d5b3e8;
  }
  .logout-btn {
    display: block;
    margin: 20px auto 0;
    padding: 8px 20px;
    background: rgba(139,26,26,0.3);
    color: #ff9999;
    border: 1px solid rgba(231,76,60,0.4);
    border-radius: 20px;
    font-family: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .logout-btn:hover {
    background: rgba(139,26,26,0.5);
    border-color: #e74c3c;
  }
</style>
</head>
<body>

<!-- ===== صفحه رمز ===== -->
<div id="loginScreen" class="login-screen">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <div class="login-title">ورود به پنل معلم</div>
    <div class="login-sub">برای دیدن اطلاعات کلاس، رمز عبور رو وارد کن</div>
    <input type="password" id="loginPassword" class="login-input" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter') checkLogin()">
    <button class="login-btn" onclick="checkLogin()">🔓 ورود</button>
    <div class="login-error" id="loginError">❌ رمز اشتباهه!</div>
    <div class="login-hint">این پنل مخصوص معلمه</div>
  </div>
</div>

<!-- ===== پنل اصلی ===== -->
<div id="mainPanel">
  <div class="container">
    <h1>📊 پنل معلم</h1>
    <div class="subtitle">فتح کهن دیار ایران — مطالعات اجتماعی پایه پنجم</div>
    
    <div id="content">
      <div class="loading">⏳ در حال بارگذاری...</div>
    </div>

   <button class="export-btn" onclick="exportCSV()">📥 دانلود Excel (CSV)</button>
    <button class="refresh-btn" onclick="loadData(false)">🔄 به‌روزرسانی</button>
    <div class="last-update" id="lastUpdate"></div>
    <button class="logout-btn" onclick="logout()">🚪 خروج از پنل</button>
  </div>
</div>

<script>
const WORKER_URL = 'https://hakim-game-worker.mahdisharifian7.workers.dev';
const PASSWORD = 'hakim2026';
const AUTH_KEY = 'ftah_teacher_auth';
const AUTH_DURATION = 7 * 24 * 60 * 60 * 1000; // ۷ روز

const COMMANDER_NAMES = {
  abumuslim: '⚔️ ابومسلم',
  nizam: '📚 خواجه نظام‌الملک',
  yaghub: '🏹 یعقوب لیث',
  nasir: '🔭 خواجه نصیر'
};
const LESSON_NAMES = {
  18: 'درس ۱۸ — قیام و حکومت‌های ایرانی',
  19: 'درس ۱۹ — سلجوقیان و وزیران',
  20: 'درس ۲۰ — حمله مغول',
  21: 'درس ۲۱ — بازسازی ایران'
};

function checkLogin() {
  const input = document.getElementById('loginPassword');
  const error = document.getElementById('loginError');
  const password = input.value.trim();
  
  if (password === PASSWORD) {
    try {
      localStorage.setItem(AUTH_KEY, JSON.stringify({ time: Date.now() }));
    } catch(e) {}
    showMainPanel();
  } else {
    error.classList.add('show');
    input.value = '';
    input.focus();
    setTimeout(() => error.classList.remove('show'), 2000);
  }
}

function isAuthenticated() {
  try {
    const auth = JSON.parse(localStorage.getItem(AUTH_KEY));
    if (auth && auth.time && (Date.now() - auth.time) < AUTH_DURATION) {
      return true;
    }
  } catch(e) {}
  return false;
}

function showMainPanel() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainPanel').classList.add('show');
  loadData(false);
  setInterval(() => loadData(true), 60000);
}

function logout() {
  try {
    localStorage.removeItem(AUTH_KEY);
  } catch(e) {}
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('mainPanel').classList.remove('show');
  document.getElementById('loginPassword').value = '';
}

async function loadData(isAutoRefresh) {
  const content = document.getElementById('content');
  
  if (!isAutoRefresh) {
    content.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
  }
  
  try {
    const [listRes, statsRes] = await Promise.all([
      fetch(WORKER_URL + '/list'),
      fetch(WORKER_URL + '/stats')
    ]);
    const students = await listRes.json();
    const stats = await statsRes.json();
    
    if (!students || students.length === 0) {
      content.innerHTML = '<div class="empty-state">📭 هنوز هیچ دانش‌آموزی بازی نکرده</div>';
      return;
    }
    
    let html = '<div class="stats-grid">';
    html += `<div class="stat-box"><span class="num">${stats.total_plays || 0}</span><div class="label">تعداد بازی</div></div>`;
    html += `<div class="stat-box"><span class="num">${Math.round(stats.avg_score || 0)}</span><div class="label">میانگین امتیاز</div></div>`;
    html += `<div class="stat-box"><span class="num">${stats.max_score || 0}</span><div class="label">بالاترین امتیاز</div></div>`;
    html += `<div class="stat-box"><span class="num">${stats.min_score || 0}</span><div class="label">پایین‌ترین امتیاز</div></div>`;
    html += '</div>';
    
    const lessonStats = { 18: {c:0,w:0}, 19: {c:0,w:0}, 20: {c:0,w:0}, 21: {c:0,w:0} };
    students.forEach(s => {
      if (s.lesson_stats) {
        try {
          const ls = JSON.parse(s.lesson_stats);
          for (let lesson in ls) {
            if (lessonStats[lesson]) {
              lessonStats[lesson].c += ls[lesson].c || 0;
              lessonStats[lesson].w += ls[lesson].w || 0;
            }
          }
        } catch(e) {}
      }
    });
    
    html += '<div class="section-title">📚 تحلیل درس‌به‌درس</div>';
    for (let lesson of [18, 19, 20, 21]) {
      const l = lessonStats[lesson];
      const total = l.c + l.w;
      const pct = total > 0 ? Math.round((l.c / total) * 100) : 0;
      let color = pct >= 80 ? '#2ecc71' : pct >= 60 ? '#3498db' : pct >= 40 ? '#e67e22' : '#e74c3c';
      let grade = pct >= 80 ? 'عالی' : pct >= 60 ? 'خوب' : pct >= 40 ? 'قابل قبول' : 'نیاز به مرور';
      
      html += `
        <div class="lesson-item">
          <div class="lesson-name">
            <span>${LESSON_NAMES[lesson]}</span>
            <span class="lesson-pct">${pct}٪</span>
          </div>
          <div class="lesson-bar"><div class="lesson-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="lesson-stat">${grade} — ${l.c} پاسخ درست از ${total}</div>
        </div>
      `;
    }
    
    html += '<div class="section-title">👥 لیست دانش‌آموزان</div>';
    html += '<table class="students-table"><thead><tr>';
    html += '<th>ردیف</th><th>نام</th><th>امتیاز</th><th>شهرها</th><th>قلب</th><th>زنجیره</th><th>سردار</th><th>تاریخ</th>';
    html += '</tr></thead><tbody>';
    
    students.forEach((s, idx) => {
      let cities = 0;
      try { cities = JSON.parse(s.conquered_cities || '[]').length; } catch(e) {}
      const scoreClass = s.score >= 16 ? 'score-high' : s.score >= 11 ? 'score-mid' : 'score-low';
      const hearts = '❤️'.repeat(s.hearts || 0) + '🖤'.repeat(3 - (s.hearts || 0));
      const date = (s.created_at || '').split(' ')[0];
      const cmd = COMMANDER_NAMES[s.commander] || '—';
      
      html += `<tr>
        <td>${idx + 1}</td>
        <td><strong>${s.student_name}</strong></td>
        <td><span class="score-badge ${scoreClass}">${s.score}</span></td>
        <td>${cities}/6</td>
        <td style="font-size:.9rem">${hearts}</td>
        <td>${s.max_combo || 0}</td>
        <td><span class="commander-tag">${cmd}</span></td>
        <td style="font-size:.7rem;color:#bda282">${date}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    
    content.innerHTML = html;
    document.getElementById('lastUpdate').textContent = 'آخرین به‌روزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
    
  } catch (e) {
    content.innerHTML = '<div class="empty-state">❌ خطا در ارتباط با سرور<br><small>' + e.message + '</small></div>';
  }
}

function exportCSV() {
  const content = document.getElementById('content');
  const table = content.querySelector('.students-table');
  
  if (!table) {
    alert('اول باید داده‌ها لود بشن!');
    return;
  }
  
  const headers = ['ردیف', 'نام', 'امتیاز', 'شهرها', 'قلب', 'زنجیره', 'سردار', 'تاریخ'];
  const rows = [];
  const trs = table.querySelectorAll('tbody tr');
  trs.forEach((tr, idx) => {
    const cells = tr.querySelectorAll('td');
    if (cells.length >= 8) {
      const row = [
        idx + 1,
        cells[1].textContent.trim(),
        cells[2].textContent.trim(),
        cells[3].textContent.trim(),
        cells[4].textContent.trim(),
        cells[5].textContent.trim(),
        cells[6].textContent.trim(),
        cells[7].textContent.trim()
      ];
      rows.push(row);
    }
  });
  
  let csv = '\ufeff';
  csv += headers.join(',') + '\n';
  rows.forEach(row => {
    csv += row.map(cell => `"${cell.replace(/"/g, '""')}"`).join(',') + '\n';
  });
  
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const link = document.createElement('a');
  const date = new Date().toISOString().split('T')[0];
  link.download = `نتایج-فتح-کهن-دیار-ایران-${date}.csv`;
  link.href = URL.createObjectURL(blob);
  link.click();
  URL.revokeObjectURL(link.href);
  
  showToast('✅ فایل Excel دانلود شد!');
}

function showToast(msg) {
  const toast = document.createElement('div');
  toast.style.cssText = `
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(135deg, #27ae60, #2ecc71);
    color: #fff;
    padding: 14px 28px;
    border-radius: 30px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 800;
    box-shadow: 0 8px 25px rgba(46,204,113,0.5);
    z-index: 9999;
    opacity: 0;
    transition: all 0.3s ease;
  `;
  toast.textContent = msg;
  document.body.appendChild(toast);
  
  requestAnimationFrame(() => {
    toast.style.opacity = '1';
    toast.style.transform = 'translateX(-50%) translateY(0)';
  });
  
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(-20px)';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// شروع
if (isAuthenticated()) {
  showMainPanel();
} else {
  document.getElementById('loginPassword').focus();
}
</script>
</body>
</html>
