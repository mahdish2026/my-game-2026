<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>پنل معلم — فتح کهن دیار ایران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(180deg, #140b04, #0a0602);
    color: #f5edd6;
    min-height: 100vh;
    padding: 20px 16px;
    direction: rtl;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #f5c842;
    margin-bottom: 8px;
    font-size: 1.5rem;
  }
  .subtitle {
    text-align: center;
    color: #bda282;
    font-size: 0.8rem;
    margin-bottom: 24px;
  }
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-box {
    background: linear-gradient(145deg, #2a1506, #1b0c03);
    border: 1.5px solid #c9941a;
    border-radius: 16px;
    padding: 16px 12px;
    text-align: center;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  }
  .stat-box .num {
    font-size: 2rem;
    font-weight: 900;
    color: #f5c842;
    display: block;
  }
  .stat-box .label {
    font-size: 0.7rem;
    color: #bda282;
    margin-top: 4px;
    font-weight: 700;
  }
  .section-title {
    color: #f5c842;
    font-size: 1.1rem;
    font-weight: 800;
    margin: 24px 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid rgba(201,148,26,0.3);
  }
  .lesson-item {
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(201,148,26,0.2);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .lesson-name {
    font-size: 0.85rem;
    font-weight: 800;
    color: #fff3b0;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .lesson-pct {
    font-size: 0.9rem;
    color: #f5c842;
  }
  .lesson-bar {
    height: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .lesson-fill {
    height: 100%;
    border-radius: 20px;
    transition: width 0.5s ease;
  }
  .lesson-stat {
    font-size: 0.7rem;
    color: #bda282;
    text-align: right;
  }
  .students-table {
    width: 100%;
    border-collapse: collapse;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    overflow: hidden;
    font-size: 0.8rem;
  }
  .students-table th {
    background: linear-gradient(135deg, #2a1506, #1b0c03);
    color: #f5c842;
    padding: 12px 8px;
    font-weight: 800;
    text-align: center;
    border-bottom: 2px solid #c9941a;
  }
  .students-table td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid rgba(201,148,26,0.1);
  }
  .students-table tr:hover {
    background: rgba(245,200,66,0.05);
  }
  .students-table tr:last-child td {
    border-bottom: none;
  }
  .score-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 0.75rem;
  }
  .score-high { background: rgba(46,204,113,0.2); color: #2ecc71; }
  .score-mid { background: rgba(52,152,219,0.2); color: #3498db; }
  .score-low { background: rgba(231,76,60,0.2); color: #e74c3c; }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #bda282;
    font-size: 0.9rem;
  }
  .refresh-btn {
    display: block;
    margin: 24px auto 0;
    padding: 12px 32px;
    background: linear-gradient(135deg, #c9941a, #f5c842);
    color: #120500;
    border: none;
    border-radius: 30px;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(245,200,66,0.3);
  }
  .refresh-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(245,200,66,0.5);
  }
  .loading {
    text-align: center;
    padding: 40px;
    color: #f5c842;
  }
  .last-update {
    text-align: center;
    color: #bda282;
    font-size: 0.7rem;
    margin-top: 20px;
  }
  .commander-tag {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.65rem;
    background: rgba(155,89,182,0.2);
    color: #d5b3e8;
  }
</style>
</head>
<body>
<div class="container">
  <h1>📊 پنل معلم</h1>
  <div class="subtitle">فتح کهن دیار ایران — مطالعات اجتماعی پایه پنجم</div>
  
  <div id="content">
    <div class="loading">⏳ در حال بارگذاری...</div>
  </div>
  
  <button class="refresh-btn" onclick="loadData()">🔄 به‌روزرسانی</button>
  <div class="last-update" id="lastUpdate"></div>
</div>

<script>
const WORKER_URL = 'https://hakim-game-worker.mahdisharifian7.workers.dev';
const COMMANDER_NAMES = {
  abumuslim: '⚔️ ابومسلم',
  nizam: '📚 خواجه نظام‌الملک',
  yaghub: '🏹 یعقوب لیث',
  nasir: '🔭 خواجه نصیر'
};
const LESSON_NAMES = {
  18: 'درس ۱۸ — قیام و حکومت‌های ایرانی',
  19: 'درس ۱۹ — سلجوقیان و وزیران',
  20: 'درس ۲۰ — حمله مغول',
  21: 'درس ۲۱ — بازسازی ایران'
};

async function loadData(isAutoRefresh) {
  const content = document.getElementById('content');
  
  if (!isAutoRefresh) {
    content.innerHTML = '<div class="loading">⏳ در حال بارگذاری...</div>';
  }
  
  try {
    const [listRes, statsRes] = await Promise.all([
      fetch(WORKER_URL + '/list'),
      fetch(WORKER_URL + '/stats')
    ]);
    const students = await listRes.json();
    const stats = await statsRes.json();
    
    if (!students || students.length === 0) {
      content.innerHTML = '<div class="empty-state">📭 هنوز هیچ دانش‌آموزی بازی نکرده</div>';
      return;
    }
    
    // آمار کلی
    let html = '<div class="stats-grid">';
    html += `<div class="stat-box"><span class="num">${stats.total_plays || 0}</span><div class="label">تعداد بازی</div></div>`;
    html += `<div class="stat-box"><span class="num">${Math.round(stats.avg_score || 0)}</span><div class="label">میانگین امتیاز</div></div>`;
    html += `<div class="stat-box"><span class="num">${stats.max_score || 0}</span><div class="label">بالاترین امتیاز</div></div>`;
    html += `<div class="stat-box"><span class="num">${stats.min_score || 0}</span><div class="label">پایین‌ترین امتیاز</div></div>`;
    html += '</div>';
    
    // تحلیل درس‌ها
    const lessonStats = { 18: {c:0,w:0}, 19: {c:0,w:0}, 20: {c:0,w:0}, 21: {c:0,w:0} };
    students.forEach(s => {
      if (s.lesson_stats) {
        try {
          const ls = JSON.parse(s.lesson_stats);
          for (let lesson in ls) {
            if (lessonStats[lesson]) {
              lessonStats[lesson].c += ls[lesson].c || 0;
              lessonStats[lesson].w += ls[lesson].w || 0;
            }
          }
        } catch(e) {}
      }
    });
    
    html += '<div class="section-title">📚 تحلیل درس‌به‌درس</div>';
    for (let lesson of [18, 19, 20, 21]) {
      const l = lessonStats[lesson];
      const total = l.c + l.w;
      const pct = total > 0 ? Math.round((l.c / total) * 100) : 0;
      let color = pct >= 80 ? '#2ecc71' : pct >= 60 ? '#3498db' : pct >= 40 ? '#e67e22' : '#e74c3c';
      let grade = pct >= 80 ? 'عالی' : pct >= 60 ? 'خوب' : pct >= 40 ? 'قابل قبول' : 'نیاز به مرور';
      
      html += `
        <div class="lesson-item">
          <div class="lesson-name">
            <span>${LESSON_NAMES[lesson]}</span>
            <span class="lesson-pct">${pct}٪</span>
          </div>
          <div class="lesson-bar"><div class="lesson-fill" style="width:${pct}%;background:${color}"></div></div>
          <div class="lesson-stat">${grade} — ${l.c} پاسخ درست از ${total}</div>
        </div>
      `;
    }
    
    // لیست دانش‌آموزان
    html += '<div class="section-title">👥 لیست دانش‌آموزان</div>';
    html += '<table class="students-table"><thead><tr>';
    html += '<th>ردیف</th><th>نام</th><th>امتیاز</th><th>شهرها</th><th>قلب</th><th>زنجیره</th><th>سردار</th><th>تاریخ</th>';
    html += '</tr></thead><tbody>';
    
    students.forEach((s, idx) => {
      let cities = 0;
      try { cities = JSON.parse(s.conquered_cities || '[]').length; } catch(e) {}
      const scoreClass = s.score >= 16 ? 'score-high' : s.score >= 11 ? 'score-mid' : 'score-low';
      const hearts = '❤️'.repeat(s.hearts || 0) + '🖤'.repeat(3 - (s.hearts || 0));
      const date = (s.created_at || '').split(' ')[0];
      const cmd = COMMANDER_NAMES[s.commander] || '—';
      
      html += `<tr>
        <td>${idx + 1}</td>
        <td><strong>${s.student_name}</strong></td>
        <td><span class="score-badge ${scoreClass}">${s.score}</span></td>
        <td>${cities}/6</td>
        <td style="font-size:.9rem">${hearts}</td>
        <td>${s.max_combo || 0}</td>
        <td><span class="commander-tag">${cmd}</span></td>
        <td style="font-size:.7rem;color:#bda282">${date}</td>
      </tr>`;
    });
    html += '</tbody></table>';
    
    content.innerHTML = html;
    document.getElementById('lastUpdate').textContent = 'آخرین به‌روزرسانی: ' + new Date().toLocaleTimeString('fa-IR');
    
  } catch (e) {
    content.innerHTML = '<div class="empty-state">❌ خطا در ارتباط با سرور<br><small>' + e.message + '</small></div>';
  }
}

loadData(false);
// هر ۶۰ ثانیه خودکار به‌روزرسانی (بدون نمایش «در حال بارگذاری»)
setInterval(() => loadData(true), 60000);
</script>
</body>
</html>
